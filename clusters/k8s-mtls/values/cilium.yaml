---
# Идентичность кластера в Cluster Mesh (ADR 0002).
# Имя и числовой идентификатор обязаны быть уникальны в пределах mesh;
# id — число от 1 до 255. Живут здесь, а не в inventory Ansible: и роль
# cilium_bootstrap, и Argo CD берут этот же файл, поэтому второе место
# хранения было бы лишним источником расхождений.
cluster:
  name: k8s-mtls
  id: 1

# Туннельный режим задан ЯВНО, а не оставлен на умолчание чарта (ADR 0002,
# раздел 3.3). При native routing связность между кластерами потребовала бы
# маршрутизируемости pod-сетей и общего nativeRoutingCIDR на все кластеры;
# в туннельном достаточно связности адресов узлов.
routingMode: tunnel
tunnelProtocol: vxlan

# Прозрачное шифрование трафика между узлами (ADR 0002, раздел 3.2).
#
# Два условия, вытекающие из работы с Cluster Mesh:
#   * включено во ВСЕХ кластерах mesh — смешанный режим не поддерживается;
#   * между узлами разных кластеров должен быть разрешён UDP 51871.
#
# Публичные ключи в соседний кластер передаёт clustermesh-apiserver,
# ручного обмена не требуется.
encryption:
  enabled: true
  type: wireguard
  # Шифрует и трафик между самими узлами, а не только между подами.
  nodeEncryption: true
# Values Cilium для стенда k8s-mtls.
#
# Единственный источник values и для bootstrap-установки Ansible (этап 50),
# и для Application, забирающей Cilium под управление Argo CD (wave -10).
# Расхождение между ними означало бы вечный OutOfSync — раздел 4.3 playbook.

# На первом этапе сохраняется штатный kube-proxy. Его замена Cilium —
# отдельное решение с отдельным тестированием (раздел 21.2).
# Замена kube-proxy — предусловие Gateway API от Cilium (ADR 0001).
#
# На этом стенде предусловие самого ADR НЕ выполнено: control-plane узел
# один, балансировщика нет, поэтому k8sServiceHost указывает на
# единственный узел. Для проверки механики это приемлемо, для выводов о
# production — нет.
kubeProxyReplacement: true
k8sServiceHost: 10.129.0.15
k8sServicePort: 6443

# Адреса Pod-подсетей узлам раздаёт controller-manager Kubernetes.
ipam:
  mode: kubernetes

operator:
  # На стенде один экземпляр: для production нужно два (раздел 17).
  replicas: 1

hubble:
  enabled: true
  tls:
    auto:
      # cronJob по той же причине, что и у clustermesh, но следствие тут
      # шире: при method: helm чарт рендерит секрет cilium-ca — ОБЩИЙ
      # центр сертификации всего Cilium — и затирает тот, что положила
      # роль из секрет-бэкенда. Общий CA для Cluster Mesh не выживает,
      # пока хоть один способ выпуска остаётся helm.
      method: cronJob
  relay:
    enabled: true
  ui:
    # UI требует ingress, которого на стенде нет.
    enabled: false

# Перекатывает Pod'ы Cilium при изменении ConfigMap.
rollOutCiliumPods: true

# Узлы стенда — 4 vCPU / 3.9 ГБ, поэтому запросы ресурсов занижены
# относительно значений по умолчанию.
resources:
  requests:
    cpu: 100m
    memory: 256Mi


# Cluster Mesh не включается: кластер одиночный, проверяется другое —
# mutual authentication и его поведение при отказе SPIRE.

# -----------------------------------------------------------------------------
# Mutual authentication (план, раздел 6). Механизм в 1.19 помечен как beta.
#
# SPIRE разворачивается ЧАРТОМ, а не внешней ролью: цель этого стенда —
# измерить поведение при отказе SPIRE, а не проверить роль spire_server.
# Для внешнего сервера чарт агентов не ставит, и их пришлось бы писать
# отдельно — это следующий шаг, если механизм окажется приемлемым.
#
# Что важно понимать при чтении результатов:
#   * рукопожатие идёт МЕЖДУ АГЕНТАМИ Cilium, а не в соединении приложения;
#   * конфиденциальность даёт WireGuard, включённый выше, а не это;
#   * механизм не действует сам по себе — нужна политика с
#     authentication.mode: required.
# -----------------------------------------------------------------------------
authentication:
  enabled: true
  mutual:
    spire:
      enabled: true
      trustDomain: spiffe.cilium
      install:
        enabled: true
        namespace: cilium-spire
        server:
          dataStorage:
            enabled: true
            size: 1Gi
            # Класс по умолчанию на этом кластере — local-path. Том
            # локальный к узлу: потеря узла с сервером SPIRE означает
            # потерю его хранилища. Для стенда приемлемо, для production
            # нужен настоящий CSI.
            storageClass: local-path

# -----------------------------------------------------------------------------
# Gateway API (ADR 0001, план раздел 5).
#
# Вносится ОТДЕЛЬНЫМ изменением, после замены kube-proxy: совмещать нельзя,
# иначе при отказе неясно, что именно сломалось.
#
# CRD ставятся ЗАРАНЕЕ и отдельно — чарт их не создаёт. Взят standard-канал
# версии 1.4.1: Cilium 1.19 проходит conformance именно для 1.4.x, и брать
# более новые CRD без проверки соответствия не стоит.
#
# ВМЕСТЕ со standard-каналом ОБЯЗАТЕЛЕН TLSRoute из experimental-канала той
# же версии, даже если TLS passthrough не используется. Оператор Cilium
# регистрирует тип TLSRoute безусловно, и без его CRD контроллер gateway
# на каждой реконсиляции от backend-сервиса выдаёт
#   no kind is registered for the type v1alpha2.TLSRouteList
# и не доводит реконсиляцию до конца. Полный список CRD — docs/VERIFICATION.md.
# -----------------------------------------------------------------------------
gatewayAPI:
  enabled: true
  # Явное true вместо умолчания "auto". При "auto" объект GatewayClass
  # рендерится, только если .Capabilities.APIVersions видит CRD в кластере,
  # а роль cilium_bootstrap вызывает `helm template` БЕЗ подключения к
  # кластеру (раздел 4.3 — чтобы не создавать helm release secret). Значит
  # проверка возможностей всегда ложна, GatewayClass не создаётся никогда,
  # и Gateway остаётся без реализации при полностью здоровом Cilium.
  gatewayClass:
    create: "true"

