---
apiVersion: v1
kind: Namespace
metadata:
  name: podinfo
  labels:
    # Пользовательские приложения работают под restricted — самым строгим
    # уровнем Pod Security Admission. Дефолт кластера baseline (раздел 14.2),
    # здесь он ужесточён намеренно: приложение не требует привилегий.
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
