---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: podinfo
  namespace: podinfo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: podinfo
  template:
    metadata:
      labels:
        app: podinfo
    spec:
      # Узлы стенда — 4 vCPU / 3.9 ГБ, а из четырёх узлов workload принимает
      # только один: на control-plane стоит taint (раздел 3.3).
      nodeSelector:
        node-role.kubernetes.io/worker: ""

      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: podinfo
          image: ghcr.io/stefanprodan/podinfo:6.9.2

          # Порт непривилегированный — иначе контейнер под UID 65534
          # не смог бы его занять.
          ports:
            - name: http
              containerPort: 9898
              protocol: TCP

          # Без этого блока Pod будет отклонён на namespace с enforce:
          # restricted ещё до планирования.
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]

          # readOnlyRootFilesystem требует, чтобы всё изменяемое было
          # вынесено в тома.
          volumeMounts:
            - name: tmp
              mountPath: /tmp

          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5

          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              memory: 64Mi

      volumes:
        - name: tmp
          emptyDir: {}
