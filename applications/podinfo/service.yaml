---
apiVersion: v1
kind: Service
metadata:
  name: podinfo
  namespace: podinfo
spec:
  # ClusterIP намеренно: ingress-контроллера на стенде нет, а у ВМ публичные
  # адреса — NodePort открыл бы приложение в интернет.
  type: ClusterIP
  selector:
    app: podinfo
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
