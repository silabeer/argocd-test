---
# Базовые ограничения для namespace пользовательских приложений
# (раздел 21.1, пункты 13-15).
#
# Применяются к namespace podinfo как к образцу. Для каждого нового
# namespace их нужно повторять — это осознанная плата за отсутствие
# оператора, раздающего дефолты автоматически.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: namespace-quota
  namespace: podinfo
spec:
  hard:
    # Потолок на namespace: без него одно приложение способно занять
    # ресурсы всего кластера, и вытеснение начнётся у соседей.
    requests.cpu: "4"
    requests.memory: 8Gi
    limits.cpu: "8"
    limits.memory: 16Gi
    # Ограничение на число объектов: защита не от нагрузки, а от утечки —
    # контроллер в цикле создаёт объекты, пока не упрётся.
    pods: "50"
    persistentvolumeclaims: "10"
    services: "20"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: namespace-defaults
  namespace: podinfo
spec:
  limits:
    # ResourceQuota на requests.cpu ТРЕБУЕТ, чтобы каждый под их указывал.
    # Без LimitRange поды без requests просто отвергаются с невнятной
    # ошибкой — LimitRange проставляет значения по умолчанию и снимает это.
    - type: Container
      default:
        cpu: 500m
        memory: 512Mi
      defaultRequest:
        cpu: 100m
        memory: 128Mi
      max:
        cpu: "2"
        memory: 4Gi
